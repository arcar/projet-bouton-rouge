name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
  trivy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image backend
        run: docker build -t backend-scan ./backend

      - name: Scanner l'image backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Construire l'image frontend
        run: docker build -t frontend-scan ./frontend

      - name: Scanner l'image frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scanner la configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
  publish:
    needs: [test, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bouton-rouge-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bouton-rouge-frontend:latest

  deploy:
    needs: publish
    runs-on: [self-hosted, deploy]
    steps:
      - name: Déployer
        run: /home/cedric/bouton-rouge/deploy.sh