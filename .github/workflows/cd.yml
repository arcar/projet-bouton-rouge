name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
  trivy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construire les images
        run: |
          docker build --pull --no-cache -t backend-scan ./backend
          docker build --pull --no-cache -t frontend-scan ./frontend

      - name: Scanner les images
        run: |
          for img in backend-scan frontend-scan; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$img"
          done

      - name: Scanner la configuration
        run: |
          docker run --rm -v "$PWD:/project" \
            aquasec/trivy:latest config \
            --severity HIGH,CRITICAL /project
  publish:
    needs: [test, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bouton-rouge-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bouton-rouge-frontend:latest

  deploy:
    needs: publish
    runs-on: [self-hosted, deploy]
    steps:
      - name: Déployer
        run: /home/cedric/bouton-rouge/deploy.sh