services:
  backend:
    image: ghcr.io/arcar/bouton-rouge-backend:latest
    restart: unless-stopped

  frontend:
    image: ghcr.io/arcar/bouton-rouge-frontend:latest
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped